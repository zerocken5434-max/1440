<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="1440">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>1440 - 今日の残り時間</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            color: #fff;
            padding: 20px;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .title {
            font-size: 1rem;
            color: #8892b0;
            margin-bottom: 15px;
            letter-spacing: 0.3em;
            font-weight: 500;
        }

        .fraction-display {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0;
            margin-bottom: 8px;
        }

        .remaining {
            font-size: clamp(4rem, 18vw, 8rem);
            font-weight: 200;
            letter-spacing: -0.02em;
            line-height: 1;
            background: linear-gradient(180deg, #64ffda 0%, #00bcd4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .separator {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 100;
            color: #5a6a8a;
            margin: 0 5px;
        }

        .total {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 200;
            color: #8892b0;
        }

        .unit {
            font-size: 1rem;
            color: #5a6a8a;
            margin-bottom: 35px;
            letter-spacing: 0.2em;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #64ffda 0%, #00bcd4 50%, #e94560 100%);
            border-radius: 5px;
            transition: width 1s linear;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.75rem;
            color: #8892b0;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 300;
            color: #64ffda;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #8892b0;
            letter-spacing: 0.1em;
            margin-top: 4px;
        }

        .time-display {
            margin-top: 35px;
            font-size: 0.85rem;
            color: #5a6a8a;
        }

        .message {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #8892b0;
            font-style: italic;
            min-height: 1.5em;
            padding: 0 10px;
            transition: opacity 0.6s ease;
            opacity: 1;
        }

        .message.fade-out {
            opacity: 0;
        }

        .quote-actions {
            margin-top: 10px;
        }

        .quote-add-btn {
            background: none;
            border: 1px solid #5a6a8a;
            color: #5a6a8a;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quote-add-btn:hover {
            border-color: #64ffda;
            color: #64ffda;
        }

        .quote-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .quote-modal.show {
            display: flex;
        }

        .quote-modal-content {
            background: #16213e;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .quote-modal-title {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #64ffda;
        }

        .quote-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #5a6a8a;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .quote-input::placeholder {
            color: #5a6a8a;
        }

        .quote-save-btn {
            background: #64ffda;
            color: #1a1a2e;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
        }

        .quote-cancel-btn {
            background: none;
            border: 1px solid #5a6a8a;
            color: #8892b0;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .custom-quotes-list {
            margin-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        .custom-quotes-label {
            font-size: 0.8rem;
            color: #5a6a8a;
            margin-bottom: 8px;
        }

        .custom-quote-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
            color: #8892b0;
        }

        .custom-quote-item span {
            flex: 1;
            margin-right: 10px;
        }

        .custom-quote-delete {
            background: none;
            border: none;
            color: #e94560;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
        }

        /* インストールバナー */
        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(100, 255, 218, 0.15);
            border: 1px solid #64ffda;
            border-radius: 12px;
            padding: 15px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .install-banner.show {
            display: flex;
        }

        .install-text {
            font-size: 0.85rem;
            color: #fff;
        }

        .install-btn {
            background: #64ffda;
            color: #1a1a2e;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .install-close {
            background: none;
            border: none;
            color: #8892b0;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">TODAY'S REMAINING</div>
        
        <div class="fraction-display">
            <span class="remaining" id="minutes">1440</span>
            <span class="separator">/</span>
            <span class="total">1440</span>
        </div>
        <div class="unit">MINUTES</div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-labels">
                <span>0:00</span>
                <span>12:00</span>
                <span>24:00</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="hoursLeft">24</div>
                <div class="stat-label">HOURS</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="percentLeft">100</div>
                <div class="stat-label">% LEFT</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="usedMinutes">0</div>
                <div class="stat-label">USED</div>
            </div>
        </div>

        <div class="time-display" id="currentTime"></div>
        <div class="message" id="message"></div>
        <div class="quote-actions">
            <button class="quote-add-btn" id="quoteAddBtn" title="名言を追加">+</button>
        </div>
    </div>

    <!-- 名言追加モーダル -->
    <div class="quote-modal" id="quoteModal">
        <div class="quote-modal-content">
            <div class="quote-modal-title">名言を追加</div>
            <input class="quote-input" id="quoteText" type="text" placeholder="名言を入力...">
            <input class="quote-input" id="quoteAuthor" type="text" placeholder="人物名を入力...">
            <div>
                <button class="quote-save-btn" id="quoteSaveBtn">保存</button>
                <button class="quote-cancel-btn" id="quoteCancelBtn">閉じる</button>
            </div>
            <div class="custom-quotes-list" id="customQuotesList"></div>
        </div>
    </div>

    <!-- インストールバナー -->
    <div class="install-banner" id="installBanner">
        <span class="install-text">ホーム画面に追加できます</span>
        <button class="install-btn" id="installBtn">追加</button>
        <button class="install-close" id="installClose">×</button>
    </div>

    <script>
        // Service Worker登録
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed:', err));
        }

        // PWAインストールプロンプト
        let deferredPrompt;
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');
        const installClose = document.getElementById('installClose');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add('show');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBanner.classList.remove('show');
            }
        });

        installClose.addEventListener('click', () => {
            installBanner.classList.remove('show');
        });

        // タイマー機能
        function updateTimer() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const elapsedMinutes = hours * 60 + minutes + seconds / 60;
            const remainingMinutes = Math.ceil(1440 - elapsedMinutes);
            const remainingHours = Math.floor(remainingMinutes / 60);
            const elapsedPercent = (elapsedMinutes / 1440) * 100;
            const remainingPercent = Math.round(100 - elapsedPercent);
            const usedMinutes = Math.floor(elapsedMinutes);

            document.getElementById('minutes').textContent = remainingMinutes;
            document.getElementById('hoursLeft').textContent = remainingHours;
            document.getElementById('percentLeft').textContent = remainingPercent;
            document.getElementById('usedMinutes').textContent = usedMinutes;
            document.getElementById('progressFill').style.width = elapsedPercent + '%';
            
            const timeStr = now.toLocaleTimeString('ja-JP', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('currentTime').textContent = timeStr;

            updateMessage(remainingMinutes, hours);
        }

        // デフォルトの名言リスト
        const defaultQuotes = [
            '「我思う、ゆえに我あり」― デカルト',
            '「万物は流転する」― ヘラクレイトス',
            '「汝自身を知れ」― ソクラテス',
            '「人間は考える葦である」― パスカル',
            '「知は力なり」― フランシス・ベーコン',
            '「朝に道を聞かば夕べに死すとも可なり」― 孔子',
            '「今日という日は残りの人生の最初の日である」― チャールズ・ディードリッヒ',
            '「千里の道も一歩から」― 老子',
            '「今日できることを明日に延ばすな」― ベンジャミン・フランクリン',
            '「天才とは1%のひらめきと99%の努力である」― エジソン',
            '「為せば成る、為さねば成らぬ何事も」― 上杉鷹山',
            '「想像力は知識よりも重要だ」― アインシュタイン',
            '「人生は自転車に乗るようなものだ。倒れないためには走り続けなければならない」― アインシュタイン',
            '「困難の中に機会がある」― アインシュタイン',
            '「時間だけが我々に与えられた唯一の財産である」― セネカ',
            '「初心忘るべからず」― 世阿弥',
            '「明日死ぬかのように生きよ、永遠に生きるかのように学べ」― ガンジー',
            '「未来とは今日始めるものである」― マルコム・X',
            '「賢者は歴史に学び、愚者は経験に学ぶ」― ビスマルク',
            '「成功とは意欲を失わずに失敗から失敗へと進むことである」― チャーチル',
            '「少年よ、大志を抱け」― クラーク博士'
        ];

        // カスタム名言の読み込み・保存
        function getCustomQuotes() {
            try {
                return JSON.parse(localStorage.getItem('customQuotes') || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveCustomQuotes(quotes) {
            localStorage.setItem('customQuotes', JSON.stringify(quotes));
        }

        // 日付+時間からランダムな名言を選ぶ（同じ日・同じ時間なら同じ名言）
        function getSeededIndex(hour, totalQuotes) {
            const today = new Date();
            const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
            const hash = ((seed * 2654435761 + hour * 40503) >>> 0) % totalQuotes;
            return hash;
        }

        // フェードアニメーション付きメッセージ更新
        let currentMessage = '';

        function updateMessage(remaining, hour) {
            const messageEl = document.getElementById('message');
            let message = '';

            if (remaining <= 180) {
                message = '「眠りは最良の瞑想である」― ダライ・ラマ';
            } else {
                const allQuotes = defaultQuotes.concat(getCustomQuotes());
                const index = getSeededIndex(hour, allQuotes.length);
                message = allQuotes[index];
            }

            if (message !== currentMessage) {
                messageEl.classList.add('fade-out');
                setTimeout(() => {
                    messageEl.textContent = message;
                    messageEl.classList.remove('fade-out');
                    currentMessage = message;
                }, 600);
            }
        }

        // 名言追加モーダル
        const quoteModal = document.getElementById('quoteModal');
        const quoteAddBtn = document.getElementById('quoteAddBtn');
        const quoteSaveBtn = document.getElementById('quoteSaveBtn');
        const quoteCancelBtn = document.getElementById('quoteCancelBtn');

        quoteAddBtn.addEventListener('click', () => {
            quoteModal.classList.add('show');
            renderCustomQuotes();
        });

        quoteCancelBtn.addEventListener('click', () => {
            quoteModal.classList.remove('show');
        });

        quoteModal.addEventListener('click', (e) => {
            if (e.target === quoteModal) {
                quoteModal.classList.remove('show');
            }
        });

        quoteSaveBtn.addEventListener('click', () => {
            const text = document.getElementById('quoteText').value.trim();
            const author = document.getElementById('quoteAuthor').value.trim();
            if (!text) return;

            const customs = getCustomQuotes();
            const formatted = author ? '「' + text + '」― ' + author : '「' + text + '」';
            customs.push(formatted);
            saveCustomQuotes(customs);

            document.getElementById('quoteText').value = '';
            document.getElementById('quoteAuthor').value = '';
            renderCustomQuotes();
        });

        function renderCustomQuotes() {
            const list = document.getElementById('customQuotesList');
            const customs = getCustomQuotes();

            if (customs.length === 0) {
                list.innerHTML = '';
                return;
            }

            let html = '<div class="custom-quotes-label">追加した名言</div>';
            customs.forEach((q, i) => {
                html += '<div class="custom-quote-item">'
                    + '<span>' + q + '</span>'
                    + '<button class="custom-quote-delete" data-index="' + i + '">×</button>'
                    + '</div>';
            });
            list.innerHTML = html;

            list.querySelectorAll('.custom-quote-delete').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    const quotes = getCustomQuotes();
                    quotes.splice(idx, 1);
                    saveCustomQuotes(quotes);
                    renderCustomQuotes();
                });
            });
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
